<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>邮件划词 AI 交互</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 画板：1600×1000，缩放居中 */
    .artboard {
      position: absolute;
      width: 1600px;
      height: 1000px;
      top: 50%;
      left: 50%;
      transform-origin: center center;
      overflow: hidden;
    }

    /* 桌面背景 — 一张图铺满 */
    .artboard > .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 邮件窗口背景图（Figma: x=207, y=65, w=1266, h=750） */
    .mail-bg {
      position: absolute;
      left: 207px;
      top: 65px;
      width: 1266px;
      height: 750px;
      object-fit: cover;
      border-radius: 12px;
    }

    /* 白色正文区域（Figma: x=230, y=502, w=1201, h=121） */
    .mail-body-rect {
      position: absolute;
      left: 230px;
      top: 502px;
      width: 1201px;
      height: 121px;
      background: white;
    }

    /* 白色底部区域（Figma: x=232, y=644, w=417, h=122） */
    .mail-footer-rect {
      position: absolute;
      left: 232px;
      top: 644px;
      width: 417px;
      height: 122px;
      background: white;
    }

    /* 邮件正文文字（Figma: x=246, y=509, w=1179） */
    .mail-text {
      position: absolute;
      left: 246px;
      top: 509px;
      width: 1179px;
      font-size: 16px;
      line-height: 24px;
      color: #000;
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      user-select: text;
      cursor: text;
    }

    /* 选中高亮层（动态生成，覆盖在文字上方） */
    .sel-highlight {
      position: absolute;
      background: rgba(51, 94, 255, 0.2);
      pointer-events: none;
    }

    /* ── 浮动工具条 ── */
    .toolbar {
      position: absolute;
      width: 452px;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 200;
    }
    .toolbar.visible { display: flex; }

    .toolbar-glow {
      position: absolute;
      bottom: -3px;
      left: 12px;
      right: 12px;
      height: 35px;
      border-radius: 12px;
      background: linear-gradient(90deg, #8d99ff 10%, #9580f2 34%, #d963d6 56%, #ff6778 74%, #ffba71 100%);
      filter: blur(6.25px);
      z-index: 0;
    }

    .toolbar-body {
      position: relative;
      z-index: 1;
      width: 422px;
      background: rgba(0, 0, 0, 0.84);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(223, 226, 231, 0.8);
      border-radius: 12px;
      padding: 6px 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.16);
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .ai-icon {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
      margin-right: 2px;
    }
    .ai-bar { width: 2px; height: 12px; background: rgba(255,255,255,0.7); border-radius: 1px; }
    .ai-star { width: 20px; height: 20px; }
    .ai-star img { width: 100%; height: 100%; }

    .toolbar-actions {
      display: flex;
      gap: 2px;
      align-items: center;
      flex: 1;
    }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      font-family: 'Microsoft YaHei', sans-serif;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.12); }
    .tool-btn img { width: 16px; height: 16px; }

    .tool-btn.primary {
      background: rgba(255,255,255,0.16);
      border-radius: 8px;
    }
    .tool-btn.primary:hover { background: rgba(255,255,255,0.26); }

    /* ── 如影框（query + 输入框） ── */
    .ruying-box {
      position: absolute;
      left: 1069px;
      top: 395px;
      width: 488px;
      display: none;
      flex-direction: column;
      gap: 36px;
      align-items: flex-start;
      z-index: 300;
    }
    .ruying-box.visible { display: flex; }

    /* query 列表 */
    .query-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .query-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      width: fit-content;
      background: rgba(35, 35, 38, 0.9);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      font-family: 'Microsoft YaHei', sans-serif;
      white-space: nowrap;
      cursor: pointer;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease, background 0.15s;
    }
    .query-tag.show {
      opacity: 1;
      transform: translateY(0);
    }
    .query-tag:hover { background: rgba(60, 60, 66, 0.95); }

    /* 输入框 */
    .ai-input-bar {
      width: 488px;
      height: 68px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      padding: 20px;
      gap: 12px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      flex-shrink: 0;
    }
    .ai-input-bar.show {
      opacity: 1;
      transform: translateY(0);
    }

    .ai-input-field {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      font-family: 'Microsoft YaHei', sans-serif;
      caret-color: rgba(255,255,255,0.6);
    }
    .ai-input-field::placeholder { color: rgba(255,255,255,0.4); }

    .input-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .input-icon-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.15s;
    }
    .input-icon-btn:hover { background: rgba(255,255,255,0.1); }
    .input-icon-btn img { width: 18px; height: 18px; }

    .input-divider {
      width: 1px; height: 12px;
      background: rgba(255,255,255,0.3);
      margin: 0 4px;
    }

    .send-btn {
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.16);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .send-btn:hover { background: rgba(255,255,255,0.28); }
    .send-btn img { width: 18px; height: 18px; }

    /* ── 答案小窗口 ── */
    .answer-window {
      position: absolute;
      left: 1092px;
      top: 307px;
      width: 440px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(60px);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 28px;
      overflow: hidden;
      display: none;
      flex-direction: column;
      z-index: 400;
      opacity: 0;
      transform: scale(0.96) translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .answer-window.visible { display: flex; }
    .answer-window.show { opacity: 1; transform: scale(1) translateY(0); }

    /* 标题栏 */
    .aw-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 0;
      flex-shrink: 0;
    }
    .aw-header-left { display: flex; gap: 8px; align-items: center; }
    .aw-header-icon { width: 24px; height: 24px; cursor: pointer; opacity: 0.6; }
    .aw-header-icon:hover { opacity: 1; }
    .aw-header-icon img { width: 100%; height: 100%; }
    .aw-title {
      display: flex; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.92);
      font-size: 16px;
      font-family: 'Microsoft YaHei', sans-serif;
      font-weight: 600;
    }
    .aw-title img { width: 24px; height: 24px; }
    .aw-header-right { display: flex; gap: 8px; align-items: center; }
    .aw-ctrl { width: 24px; height: 24px; cursor: pointer; opacity: 0.6; display: flex; align-items: center; justify-content: center; }
    .aw-ctrl:hover { opacity: 1; }
    .aw-ctrl img { width: 100%; height: 100%; }

    /* 内容区 */
    .aw-content {
      padding: 20px 20px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      max-height: 320px;
      margin-bottom: 20px;
    }

    /* 用户气泡 */
    .aw-user-bubble {
      align-self: flex-end;
      background: rgba(255,255,255,0.16);
      border-radius: 12px 2px 12px 12px;
      padding: 10px 16px;
      color: rgba(255,255,255,0.92);
      font-size: 16px;
      font-family: 'Microsoft YaHei', sans-serif;
      line-height: 26px;
      max-width: 80%;
    }

    /* AI 回答 */
    .aw-answer {
      color: rgba(255,255,255,0.92);
      font-size: 16px;
      font-family: 'Microsoft YaHei', sans-serif;
      line-height: 26px;
      width: 100%;
    }

    /* 打字动画 */
    .aw-answer .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 16px;
      background: rgba(255,255,255,0.7);
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* 操作栏 */
    .aw-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 20px;
      flex-shrink: 0;
    }
    .aw-action-group { display: flex; gap: 8px; align-items: center; }
    .aw-action-btn {
      display: flex; align-items: center; gap: 3px;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
      color: rgba(255,255,255,0.48);
      font-size: 12px;
      font-family: 'Microsoft YaHei', sans-serif;
      transition: background 0.15s, color 0.15s;
    }
    .aw-action-btn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
    .aw-action-btn img { width: 18px; height: 18px; opacity: 0.6; }
    .aw-action-btn:hover img { opacity: 1; }

    /* 插入高亮块 */
    .inserted-highlight {
      background: rgba(51, 94, 255, 0.2);
      border-radius: 2px;
    }

    /* 底部输入框 */
    .aw-input-bar {
      margin: 0 20px 20px;
      height: 60px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(50px);
      border: 1px solid rgba(255,255,255,0.38);
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 16px;
      gap: 12px;
      flex-shrink: 0;
    }
    .aw-input-field {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      font-family: 'Microsoft YaHei', sans-serif;
    }
    .aw-input-field::placeholder { color: rgba(255,255,255,0.4); }

  </style>
</head>

<script>
  // ── 缩放适配 ──
  function scaleArtboard() {
    const board = document.getElementById('artboard');
    const scale = Math.min(window.innerWidth / 1600, window.innerHeight / 1000);
    board.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  scaleArtboard();
  window.addEventListener('resize', scaleArtboard);

  // ── 工具条 ──
  const toolbar = document.getElementById('toolbar');
  const hint    = document.getElementById('hint');
  let selectedText = '';
  let savedRange = null; // 保存划词的 range，用于插入

  document.addEventListener('mouseup', (e) => {
    setTimeout(() => {
      const sel = window.getSelection();
      const text = sel ? sel.toString().trim() : '';
      if (text.length > 0) {
        selectedText = text;
        // 保存 range 用于后续插入
        if (sel.rangeCount > 0) savedRange = sel.getRangeAt(0).cloneRange();
        positionToolbar(sel);
        hint.classList.add('hidden');
      } else if (!toolbar.contains(e.target)) {
        hideToolbar();
      }
    }, 10);
  });

  function positionToolbar(sel) {
    if (!sel || sel.rangeCount === 0) return;
    const range   = sel.getRangeAt(0);
    const rect    = range.getBoundingClientRect();
    const board   = document.getElementById('artboard');
    const bRect   = board.getBoundingClientRect();
    const scale   = bRect.width / 1600;

    // 选区中心 x，选区顶部 y（画板坐标）
    const cx = (rect.left + rect.width  / 2 - bRect.left) / scale;
    const ty = (rect.top               - bRect.top)  / scale;

    const toolW = 452;
    let left = cx - toolW / 2;
    let top  = ty - 57 - 10; // 工具条高57 + 10px间距

    // 边界保护
    left = Math.max(8, Math.min(left, 1600 - toolW - 8));
    if (top < 8) top = ty + (rect.height / scale) + 10; // 放到选区下方

    toolbar.style.left = left + 'px';
    toolbar.style.top  = top  + 'px';
    toolbar.classList.add('visible');
  }

  function hideToolbar() {
    toolbar.classList.remove('visible');
    selectedText = '';
  }

  function handleAction(name) {
    alert(`「${name}」— 选中文字：「${selectedText}」`);
    hideToolbar();
  }

  function handleAskAI() {
    hideToolbar();
    showRuyingBox();
  }

  // ── 如影框 ──
  const ruyingBox  = document.getElementById('ruyingBox');
  const aiInputBar = document.getElementById('aiInputBar');
  const aiInput    = document.getElementById('aiInput');
  const queryTags  = document.querySelectorAll('.query-tag');

  function showRuyingBox() {
    ruyingBox.classList.add('visible');
    // 先出输入框
    setTimeout(() => {
      aiInputBar.classList.add('show');
      aiInput.focus();
    }, 60);
    // 再依次出 query（从下往上，反序）
    const tags = Array.from(queryTags).reverse();
    tags.forEach((tag, i) => {
      setTimeout(() => tag.classList.add('show'), 180 + i * 120);
    });
  }

  function hideRuyingBox() {
    queryTags.forEach(t => t.classList.remove('show'));
    aiInputBar.classList.remove('show');
    setTimeout(() => ruyingBox.classList.remove('visible'), 250);
  }

  // query 点击 → 直接打开答案窗口
  const ANSWERS = {
    '总结这封邮件的核心要点': '这封邮件的核心要点：\n\n1. 平板新产品将于三月初上线，需提前收集产品卖点并导入天禧。\n2. 希望了解天禧近期版本更新计划，以便安排内容导入时间节点。\n3. 询问内容适合导入哪个版本。\n4. 完整宣发资料预计2月底提供。',
    '识别屏幕': '当前屏幕显示的是一封邮件编辑界面，邮件内容涉及平板新产品上线计划，发件人正在询问天禧版本更新计划及内容导入时间节点。',
    '润色下邮件话术': '烦请提供天禧超级智能体近期版本迭代与上线时间计划，我方将据此制定内容导入与上线节奏。同时请协助明确，我方内容适配导入至哪个版本更为稳妥。将据此制定内容导入与上线节奏。同时请协助明确，我方内容适配导入至哪个版本更为稳妥。'
  };

  queryTags.forEach(tag => {
    tag.addEventListener('click', () => {
      const query = tag.dataset.query;
      hideRuyingBox();
      showAnswerWindow(query, ANSWERS[query] || '正在生成回答...');
    });
  });

  // 发送按钮（输入框）
  document.getElementById('sendBtn').addEventListener('click', () => {
    const val = aiInput.value.trim();
    if (val) {
      hideRuyingBox();
      showAnswerWindow(val, '正在为您生成回答，请稍候...');
      aiInput.value = '';
    }
  });
  aiInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('sendBtn').click();
  });

  // ── 答案窗口 ──
  const answerWindow = document.getElementById('answerWindow');
  const awUserBubble = document.getElementById('awUserBubble');
  const awAnswer     = document.getElementById('awAnswer');
  const awActions    = document.getElementById('awActions');
  let typingTimer    = null;
  let currentAnswer  = '';

  function showAnswerWindow(query, answer) {
    // 重置
    currentAnswer = answer;
    awUserBubble.textContent = query;
    awAnswer.innerHTML = '';
    awActions.style.display = 'none';

    answerWindow.classList.add('visible');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => answerWindow.classList.add('show'));
    });

    // 打字动画
    clearTimeout(typingTimer);
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'typing-cursor';
    awAnswer.appendChild(cursor);

    function typeNext() {
      if (i < answer.length) {
        cursor.before(answer[i] === '\n' ? document.createElement('br') : document.createTextNode(answer[i]));
        i++;
        typingTimer = setTimeout(typeNext, 28);
      } else {
        cursor.remove();
        awActions.style.display = 'flex';
      }
    }
    setTimeout(typeNext, 300);
  }

  document.getElementById('awClose').addEventListener('click', () => {
    answerWindow.classList.remove('show');
    setTimeout(() => answerWindow.classList.remove('visible'), 200);
    clearTimeout(typingTimer);
  });

  function handleInsert() {
    if (!savedRange) return;
    // 把 range 折叠到末尾（选区结束位置后面插入）
    const range = savedRange.cloneRange();
    range.collapse(false);

    // 创建高亮 span 包裹插入内容
    const span = document.createElement('span');
    span.className = 'inserted-highlight';
    span.textContent = currentAnswer;
    range.insertNode(span);

    // 关闭答案窗口
    answerWindow.classList.remove('show');
    setTimeout(() => answerWindow.classList.remove('visible'), 200);
  }

  function handleReplace() {
    if (!savedRange) return;
    const range = savedRange.cloneRange();
    range.deleteContents();

    const span = document.createElement('span');
    span.className = 'inserted-highlight';
    span.textContent = currentAnswer;
    range.insertNode(span);

    answerWindow.classList.remove('show');
    setTimeout(() => answerWindow.classList.remove('visible'), 200);
  }

  // 点击空白处关闭如影框
  document.getElementById('artboard').addEventListener('mousedown', (e) => {
    if (!ruyingBox.contains(e.target) && !toolbar.contains(e.target) && !answerWindow.contains(e.target)) {
      hideRuyingBox();
    }
  });
</script>
</body>
</html>
