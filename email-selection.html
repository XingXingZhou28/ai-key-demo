<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>邮件划词 AI 交互</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 画板：1600×1000，缩放居中 */
    .artboard {
      position: absolute;
      width: 1600px;
      height: 1000px;
      top: 50%;
      left: 50%;
      transform-origin: center center;
      overflow: hidden;
    }

    /* 桌面背景 — 一张图铺满 */
    .artboard > .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 邮件窗口背景图（Figma: x=207, y=65, w=1266, h=750） */
    .mail-bg {
      position: absolute;
      left: 207px;
      top: 65px;
      width: 1266px;
      height: 750px;
      object-fit: cover;
      border-radius: 12px;
    }

    /* 白色正文区域（Figma: x=230, y=502, w=1201, h=121） */
    .mail-body-rect {
      position: absolute;
      left: 230px;
      top: 502px;
      width: 1201px;
      height: 121px;
      background: white;
    }

    /* 白色底部区域（Figma: x=232, y=644, w=417, h=122） */
    .mail-footer-rect {
      position: absolute;
      left: 232px;
      top: 644px;
      width: 417px;
      height: 122px;
      background: white;
    }

    /* 邮件正文文字（Figma: x=246, y=509, w=1179） */
    .mail-text {
      position: absolute;
      left: 246px;
      top: 509px;
      width: 1179px;
      font-size: 16px;
      line-height: 24px;
      color: #000;
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      user-select: text;
      cursor: text;
    }

    /* 选中高亮层（动态生成，覆盖在文字上方） */
    .sel-highlight {
      position: absolute;
      background: rgba(51, 94, 255, 0.2);
      pointer-events: none;
    }

    /* ── 浮动工具条 ── */
    .toolbar {
      position: absolute;
      width: 452px;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 200;
    }
    .toolbar.visible { display: flex; }

    .toolbar-glow {
      position: absolute;
      bottom: -3px;
      left: 12px;
      right: 12px;
      height: 35px;
      border-radius: 12px;
      background: linear-gradient(90deg, #8d99ff 10%, #9580f2 34%, #d963d6 56%, #ff6778 74%, #ffba71 100%);
      filter: blur(6.25px);
      z-index: 0;
    }

    .toolbar-body {
      position: relative;
      z-index: 1;
      width: 422px;
      background: rgba(0, 0, 0, 0.84);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(223, 226, 231, 0.8);
      border-radius: 12px;
      padding: 6px 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.16);
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .ai-icon {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
      margin-right: 2px;
    }
    .ai-grip { width: 6px; height: 12px; flex-shrink: 0; }
    .ai-star { width: 20px; height: 20px; }
    .ai-star img { width: 100%; height: 100%; }

    .toolbar-actions {
      display: flex;
      gap: 2px;
      align-items: center;
      flex: 1;
    }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      font-family: 'Microsoft YaHei', sans-serif;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.12); }
    .tool-btn img { width: 16px; height: 16px; }

    .tool-btn.primary {
      background: rgba(255,255,255,0.16);
      border-radius: 8px;
    }
    .tool-btn.primary:hover { background: rgba(255,255,255,0.26); }

    /* ── 如影框（query + 输入框） ── */
    .ruying-box {
      position: absolute;
      width: 488px;
      display: none;
      flex-direction: column;
      gap: 36px;
      align-items: flex-start;
      z-index: 300;
    }
    .ruying-box.visible { display: flex; }

    /* query 列表 */
    .query-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .query-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      width: fit-content;
      background: rgba(35, 35, 38, 0.9);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      font-family: 'Microsoft YaHei', sans-serif;
      white-space: nowrap;
      cursor: pointer;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease, background 0.15s;
    }
    .query-tag.show {
      opacity: 1;
      transform: translateY(0);
    }
    .query-tag:hover { background: rgba(60, 60, 66, 0.95); }

    /* 输入框 */
    .ai-input-bar {
      width: 488px;
      height: 68px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      padding: 20px;
      gap: 12px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      flex-shrink: 0;
    }
    .ai-input-bar.show {
      opacity: 1;
      transform: translateY(0);
    }

    .ai-input-field {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      font-family: 'Microsoft YaHei', sans-serif;
      caret-color: rgba(255,255,255,0.6);
    }
    .ai-input-field::placeholder { color: rgba(255,255,255,0.4); }

    .input-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .input-icon-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.15s;
    }
    .input-icon-btn:hover { background: rgba(255,255,255,0.1); }
    .input-icon-btn img { width: 18px; height: 18px; }

    .input-divider {
      width: 1px; height: 12px;
      background: rgba(255,255,255,0.3);
      margin: 0 4px;
    }

    .send-btn {
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.16);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .send-btn:hover { background: rgba(255,255,255,0.28); }
    .send-btn img { width: 18px; height: 18px; }

    /* ── 答案小窗口 ── */
    .answer-window {
      position: absolute;
      width: 440px;
      min-width: 440px;
      min-height: 320px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(60px);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 28px;
      overflow: visible;
      display: none;
      flex-direction: column;
      z-index: 400;
      opacity: 0;
      transform: scale(0.96) translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-sizing: border-box;
    }
    .answer-window.visible { display: flex; }
    .answer-window.show { opacity: 1; transform: scale(1) translateY(0); }
    .answer-window.dragging, .answer-window.resizing { transition: none; user-select: none; }

    /* resize handles */
    .resize-handle {
      position: absolute;
      z-index: 10;
    }
    .resize-handle.n  { top: -4px; left: 16px; right: 16px; height: 8px; cursor: n-resize; }
    .resize-handle.s  { bottom: -4px; left: 16px; right: 16px; height: 8px; cursor: s-resize; }
    .resize-handle.e  { right: -4px; top: 16px; bottom: 16px; width: 8px; cursor: e-resize; }
    .resize-handle.w  { left: -4px; top: 16px; bottom: 16px; width: 8px; cursor: w-resize; }
    .resize-handle.ne { top: -4px; right: -4px; width: 20px; height: 20px; cursor: ne-resize; border-radius: 0 28px 0 0; }
    .resize-handle.nw { top: -4px; left: -4px; width: 20px; height: 20px; cursor: nw-resize; border-radius: 28px 0 0 0; }
    .resize-handle.se { bottom: -4px; right: -4px; width: 20px; height: 20px; cursor: se-resize; border-radius: 0 0 28px 0; }
    .resize-handle.sw { bottom: -4px; left: -4px; width: 20px; height: 20px; cursor: sw-resize; border-radius: 0 0 0 28px; }

    /* 标题栏 */
    .aw-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 0;
      flex-shrink: 0;
    }
    .aw-header-left { display: flex; gap: 8px; align-items: center; }
    .aw-header-icon { width: 24px; height: 24px; cursor: pointer; opacity: 0.6; }
    .aw-header-icon:hover { opacity: 1; }
    .aw-header-icon img { width: 100%; height: 100%; }
    .aw-title {
      display: flex; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.92);
      font-size: 16px;
      font-family: 'Microsoft YaHei', sans-serif;
      font-weight: 600;
    }
    .aw-title img { width: 24px; height: 24px; }
    .aw-header-right { display: flex; gap: 8px; align-items: center; }
    .aw-ctrl { width: 24px; height: 24px; cursor: pointer; opacity: 0.6; display: flex; align-items: center; justify-content: center; }
    .aw-ctrl:hover { opacity: 1; }
    .aw-ctrl img { width: 100%; height: 100%; }

    /* 内容区 */
    .aw-content {
      padding: 20px 20px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      flex: 1 1 auto;
      min-height: 0;
      margin-bottom: 20px;
    }

    /* 自定义滚动条 */
    .aw-content::-webkit-scrollbar { width: 4px; }
    .aw-content::-webkit-scrollbar-track { background: transparent; }
    .aw-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
    .aw-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

    /* 用户气泡 */
    .aw-user-bubble {
      align-self: flex-end;
      background: rgba(255,255,255,0.16);
      border-radius: 12px 2px 12px 12px;
      padding: 10px 16px;
      color: rgba(255,255,255,0.92);
      font-size: 16px;
      font-family: 'Microsoft YaHei', sans-serif;
      line-height: 26px;
      max-width: 80%;
    }

    /* AI 回答 */
    .aw-answer {
      color: rgba(255,255,255,0.92);
      font-size: 16px;
      font-family: 'Microsoft YaHei', sans-serif;
      line-height: 26px;
      width: 100%;
    }

    /* 打字动画 */
    .aw-answer .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 16px;
      background: rgba(255,255,255,0.7);
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* 操作栏 */
    .aw-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 20px;
      flex-shrink: 0;
    }
    .aw-action-group { display: flex; gap: 8px; align-items: center; }
    .aw-action-btn {
      display: flex; align-items: center; gap: 3px;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
      color: rgba(255,255,255,0.48);
      font-size: 12px;
      font-family: 'Microsoft YaHei', sans-serif;
      transition: background 0.15s, color 0.15s;
    }
    .aw-action-btn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
    .aw-action-btn img { width: 18px; height: 18px; opacity: 0.6; }
    .aw-action-btn:hover img { opacity: 1; }

    /* 插入高亮块 */
    .inserted-highlight {
      background: rgba(51, 94, 255, 0.2);
      border-radius: 2px;
    }

    /* 底部输入框 */
    .aw-input-bar {
      margin: 0 20px 20px;
      height: 60px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(50px);
      border: 1px solid rgba(255,255,255,0.38);
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 16px;
      gap: 12px;
      flex-shrink: 0;
    }
    .aw-input-field {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      font-family: 'Microsoft YaHei', sans-serif;
    }
    .aw-input-field::placeholder { color: rgba(255,255,255,0.4); }

    /* ── 翻译小窗口（复用 answer-window 样式） ── */
    .translate-window {
      position: absolute;
      width: 440px;
      min-width: 440px;
      min-height: 320px;
      background: rgba(0, 0, 0, 0.84);
      backdrop-filter: blur(60px);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 28px;
      overflow: visible;
      display: none;
      flex-direction: column;
      z-index: 400;
      opacity: 0;
      transform: scale(0.96) translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-sizing: border-box;
    }
    .translate-window.visible { display: flex; }
    .translate-window.show { opacity: 1; transform: scale(1) translateY(0); }
    .translate-window.dragging, .translate-window.resizing { transition: none; user-select: none; }

    /* ── 润色小窗口 ── */
    .polish-window {
      position: absolute;
      width: 440px;
      min-width: 440px;
      min-height: 320px;
      background: rgba(0, 0, 0, 0.84);
      backdrop-filter: blur(60px);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 28px;
      overflow: hidden;
      display: none;
      flex-direction: column;
      z-index: 400;
      opacity: 0;
      transform: scale(0.96) translateY(6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-sizing: border-box;
    }
    .polish-window.visible { display: flex; }
    .polish-window.show { opacity: 1; transform: scale(1) translateY(0); }
    .polish-window.dragging, .polish-window.resizing { transition: none; user-select: none; }

    /* aw-content 高度随窗口伸缩 */

    /* 翻译结果区 */
    .tw-result {
      color: rgba(255,255,255,0.92);
      font-size: 16px;
      font-family: 'Microsoft YaHei', sans-serif;
      line-height: 26px;
      width: 100%;
    }
    .tw-result .typing-cursor {
      display: inline-block; width: 2px; height: 16px;
      background: rgba(255,255,255,0.7); margin-left: 2px;
      vertical-align: middle; animation: blink 0.8s step-end infinite;
    }

  </style>
</head>
<body>

<div class="artboard" id="artboard">

  <!-- 桌面背景 -->
  <img class="bg" src="assets/desktop-bg.png" alt="">

  <!-- 邮件窗口背景 -->
  <img class="mail-bg" src="assets/mail-window.png" alt="">

  <!-- 白色正文区 -->
  <div class="mail-body-rect"></div>
  <div class="mail-footer-rect"></div>

  <!-- 邮件正文（可选中） -->
  <div class="mail-text" id="mailText">
    <p>Hi.王宇、金醒，</p>
    <p>&nbsp;</p>
    <p>平板有一个新产品将在三月初上线更新，在此之前我们会先开始收集产品卖点并计划导入到天禧中。所以想了解下天禧近期的版本更新计划，以便我们安排内容导入的时间节点，并且也想知道我们这些内容导入哪个版本会比较合适。感谢~</p>
    <p>&nbsp;</p>
    <p>完整的宣发资料大概2月底会准备好并提供。</p>
  </div>

  <!-- 浮动工具条 -->
  <div class="toolbar" id="toolbar">
    <div class="toolbar-body">
      <div class="ai-icon">
        <!-- 6-dot grip icon (2×3) from Figma 582:18811 -->
        <svg class="ai-grip" viewBox="0 0 6 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="1" cy="1"  r="1" fill="white" fill-opacity="0.48"/>
          <circle cx="1" cy="6"  r="1" fill="white" fill-opacity="0.48"/>
          <circle cx="1" cy="11" r="1" fill="white" fill-opacity="0.48"/>
          <circle cx="5" cy="1"  r="1" fill="white" fill-opacity="0.48"/>
          <circle cx="5" cy="6"  r="1" fill="white" fill-opacity="0.48"/>
          <circle cx="5" cy="11" r="1" fill="white" fill-opacity="0.48"/>
        </svg>
        <div class="ai-star">
          <img src="assets/ai-star.svg" alt="">
        </div>
      </div>
      <div class="toolbar-actions">
        <div class="tool-btn" onclick="handleAction('搜索')">
          <img src="assets/icon-search.svg" alt="">
          <span>搜索</span>
        </div>
        <div class="tool-btn" onclick="handleTranslate()">
          <span style="font-size:12px;opacity:.8">中/A</span>
          <span>翻译</span>
        </div>
        <div class="tool-btn" onclick="handlePolish()">
          <img src="assets/icon-polish.svg" alt="">
          <span>润色</span>
        </div>
        <div class="tool-btn" onclick="handleAction('复制')">
          <img src="assets/icon-copy.svg" alt="">
          <span>复制</span>
        </div>
        <div class="tool-btn primary" onclick="handleAskAI()">
          <img src="assets/icon-ask.svg" alt="">
          <span>问问天禧</span>
        </div>
        <div class="tool-btn" onclick="handleAction('更多')">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="3" cy="8" r="1.5" fill="rgba(255,255,255,0.8)"/>
            <circle cx="8" cy="8" r="1.5" fill="rgba(255,255,255,0.8)"/>
            <circle cx="13" cy="8" r="1.5" fill="rgba(255,255,255,0.8)"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="toolbar-glow"></div>
  </div>

  <div class="hint hidden" id="hint"></div>

  <!-- 如影框：query + 输入框 -->
  <div class="ruying-box" id="ruyingBox">
    <div class="query-list" id="queryList">
      <div class="query-tag" data-query="总结这封邮件的核心要点">🧐 总结这封邮件的核心要点</div>
      <div class="query-tag" data-query="识别屏幕">👀 识别屏幕</div>
      <div class="query-tag" data-query="润色下邮件话术">📚 润色下邮件话术</div>
    </div>
    <div class="ai-input-bar" id="aiInputBar">
      <input class="ai-input-field" id="aiInput" type="text" placeholder="需要我帮你做什么">
      <div class="input-actions">
        <div class="input-icon-btn">
          <img src="assets/icon-add.svg" alt="">
        </div>
        <div class="input-icon-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="1" width="6" height="10" rx="3" fill="rgba(255,255,255,0.8)"/>
            <path d="M3 9C3 12.3137 5.68629 15 9 15C12.3137 15 15 12.3137 15 9" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="9" y1="15" x2="9" y2="17" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="input-divider"></div>
        <div class="send-btn" id="sendBtn">
          <img src="assets/icon-send.svg" alt="">
        </div>
      </div>
    </div>
  </div>

  <!-- 答案小窗口 -->
  <div class="answer-window" id="answerWindow">
    <div class="resize-handle n"></div>
    <div class="resize-handle s"></div>
    <div class="resize-handle e"></div>
    <div class="resize-handle w"></div>
    <div class="resize-handle ne"></div>
    <div class="resize-handle nw"></div>
    <div class="resize-handle se"></div>
    <div class="resize-handle sw"></div>
    <div class="aw-header" style="cursor:move">
      <div class="aw-header-left">
        <div class="aw-header-icon"><img src="assets/aw-icon1.svg" alt=""></div>
        <div class="aw-header-icon"><img src="assets/aw-icon2.svg" alt=""></div>
      </div>
      <div class="aw-title">
        <img src="assets/tianxi-icon2.svg" alt="">
        天禧AI
      </div>
      <div class="aw-header-right">
        <div class="aw-ctrl" title="最小化">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="6" y="11" width="12" height="2" rx="1" fill="rgba(255,255,255,0.6)"/></svg>
        </div>
        <div class="aw-ctrl" id="awClose" title="关闭">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M7 7L17 17M17 7L7 17" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
      </div>

  // ── 缩放适配 ──
  function scaleArtboard() {
    const board = document.getElementById('artboard');
    const scale = Math.min(window.innerWidth / 1600, window.innerHeight / 1000);
    board.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  scaleArtboard();
  window.addEventListener('resize', scaleArtboard);

  // ── 工具条 ──
  const toolbar = document.getElementById('toolbar');
  const hint    = document.getElementById('hint');
  let selectedText = '';
  let savedRange = null; // 保存划词的 range，用于插入
  let selectionPos = { cx: 800, ty: 400, by: 420 }; // 选区位置（画板坐标）

  document.addEventListener('mouseup', (e) => {
    setTimeout(() => {
      const sel = window.getSelection();
      const text = sel ? sel.toString().trim() : '';
      if (text.length > 0) {
        selectedText = text;
        if (sel.rangeCount > 0) savedRange = sel.getRangeAt(0).cloneRange();
        // 清除之前的插入/替换高亮
        document.querySelectorAll('.inserted-highlight').forEach(el => {
          el.replaceWith(document.createTextNode(el.textContent));
        });
        positionToolbar(sel);
        hint.classList.add('hidden');
      } else if (!toolbar.contains(e.target)) {
        hideToolbar();
      }
    }, 10);
  });

  function positionToolbar(sel) {
    if (!sel || sel.rangeCount === 0) return;
    const range   = sel.getRangeAt(0);
    const rect    = range.getBoundingClientRect();
    const board   = document.getElementById('artboard');
    const bRect   = board.getBoundingClientRect();
    const scale   = bRect.width / 1600;

    // 选区中心 x，选区顶部 y（画板坐标）
    const cx = (rect.left + rect.width  / 2 - bRect.left) / scale;
    const rx = (rect.right                  - bRect.left) / scale;
    const lx = (rect.left                   - bRect.left) / scale;
    const ty = (rect.top                    - bRect.top)  / scale;
    const by = (rect.bottom                 - bRect.top)  / scale;
    selectionPos = { cx, rx, lx, ty, by };

    const toolW = 452;
    let left = cx - toolW / 2;
    let top  = ty - 57 - 10; // 工具条高57 + 10px间距

    // 边界保护
    left = Math.max(8, Math.min(left, 1600 - toolW - 8));
    if (top < 8) top = ty + (rect.height / scale) + 10; // 放到选区下方

    toolbar.style.left = left + 'px';
    toolbar.style.top  = top  + 'px';
    toolbar.classList.add('visible');
  }

  function hideToolbar() {
    toolbar.classList.remove('visible');
    selectedText = '';
  }

  function handleAction(name) {
    alert(`「${name}」— 选中文字：「${selectedText}」`);
    hideToolbar();
  }

  function handleAskAI() {
    hideToolbar();
    showRuyingBox();
  }

  // ── 如影框 ──
  const ruyingBox  = document.getElementById('ruyingBox');
  const aiInputBar = document.getElementById('aiInputBar');
  const aiInput    = document.getElementById('aiInput');
  const queryTags  = document.querySelectorAll('.query-tag');

  function showRuyingBox() {
    const ruyW = 488;
    const toolLeft = parseInt(toolbar.style.left);
    const toolTop  = parseInt(toolbar.style.top);
    let left = toolLeft;
    let top  = toolTop; // 顶部对齐 toolbar
    left = Math.max(8, Math.min(left, 1600 - ruyW - 8));

    ruyingBox.style.left = left + 'px';
    ruyingBox.style.top  = top  + 'px';
    ruyingBox.classList.add('visible');
    // 先出输入框
    setTimeout(() => {
      aiInputBar.classList.add('show');
      aiInput.focus();
    }, 60);
    // 3 个 query 一起出现
    setTimeout(() => {
      queryTags.forEach(tag => tag.classList.add('show'));
    }, 180);
  }

  function hideRuyingBox() {
    queryTags.forEach(t => t.classList.remove('show'));
    aiInputBar.classList.remove('show');
    setTimeout(() => ruyingBox.classList.remove('visible'), 250);
  }

  // query 点击 → 直接打开答案窗口
  const ANSWERS = {
    '总结这封邮件的核心要点': '这封邮件的核心要点：\n\n1. 平板新产品将于三月初上线，需提前收集产品卖点并导入天禧。\n2. 希望了解天禧近期版本更新计划，以便安排内容导入时间节点。\n3. 询问内容适合导入哪个版本。\n4. 完整宣发资料预计2月底提供。',
    '识别屏幕': '当前屏幕显示的是一封邮件编辑界面，邮件内容涉及平板新产品上线计划，发件人正在询问天禧版本更新计划及内容导入时间节点。',
    '润色下邮件话术': '烦请提供天禧超级智能体近期版本迭代与上线时间计划，我方将据此制定内容导入与上线节奏。同时请协助明确，我方内容适配导入至哪个版本更为稳妥。将据此制定内容导入与上线节奏。同时请协助明确，我方内容适配导入至哪个版本更为稳妥。'
  };

  queryTags.forEach(tag => {
    tag.addEventListener('click', () => {
      const query = tag.dataset.query;
      hideRuyingBox();
      showAnswerWindow(query, ANSWERS[query] || '正在生成回答...');
    });
  });

  // 发送按钮（输入框）
  document.getElementById('sendBtn').addEventListener('click', () => {
    const val = aiInput.value.trim();
    if (val) {
      hideRuyingBox();
      showAnswerWindow(val, '正在为您生成回答，请稍候...');
      aiInput.value = '';
    }
  });
  aiInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('sendBtn').click();
  });

  // ── 答案窗口 ──
  const answerWindow = document.getElementById('answerWindow');
  const awUserBubble = document.getElementById('awUserBubble');
  const awAnswer     = document.getElementById('awAnswer');
  const awActions    = document.getElementById('awActions');
  let typingTimer    = null;
  let currentAnswer  = '';

  function showAnswerWindow(query, answer) {
    // 跟随如影框，左对齐，出现在如影框正下方
    const rLeft = parseInt(ruyingBox.style.left) || parseInt(toolbar.style.left) || 200;
    const rTop  = parseInt(ruyingBox.style.top)  || 400;
    const awW = 440;
    let left = rLeft;
    let top  = rTop;
    left = Math.max(8, Math.min(left, 1600 - awW - 8));
    answerWindow.style.left   = left + 'px';
    answerWindow.style.top    = top  + 'px';
    answerWindow.style.width  = '440px';
    answerWindow.style.height = '';

    // 重置，生成期间禁用拖拽
    awDR.disable();
    currentAnswer = answer;
    awUserBubble.textContent = query;
    awAnswer.innerHTML = '';
    awActions.style.display = 'none';

    answerWindow.classList.add('visible');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => answerWindow.classList.add('show'));
    });

    // 打字动画
    clearTimeout(typingTimer);
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'typing-cursor';
    awAnswer.appendChild(cursor);

    function typeNext() {
      if (i < answer.length) {
        cursor.before(answer[i] === '\n' ? document.createElement('br') : document.createTextNode(answer[i]));
        i++;
        typingTimer = setTimeout(typeNext, 28);
      } else {
        cursor.remove();
        awActions.style.display = 'flex';
        awDR.enable(); // 生成完毕，启用拖拽
      }
    }
    setTimeout(typeNext, 300);
  }

  document.getElementById('awClose').addEventListener('click', () => {
    answerWindow.classList.remove('show');
    setTimeout(() => answerWindow.classList.remove('visible'), 200);
    clearTimeout(typingTimer);
  });

  function handleInsert() {
    if (!savedRange) return;
    // 把 range 折叠到末尾（选区结束位置后面插入）
    const range = savedRange.cloneRange();
    range.collapse(false);

    // 创建高亮 span 包裹插入内容
    const span = document.createElement('span');
    span.className = 'inserted-highlight';
    span.textContent = currentAnswer;
    range.insertNode(span);

    // 关闭答案窗口
    answerWindow.classList.remove('show');
    setTimeout(() => answerWindow.classList.remove('visible'), 200);
  }

  function handleReplace() {
    if (!savedRange) return;
    const range = savedRange.cloneRange();
    range.deleteContents();

    const span = document.createElement('span');
    span.className = 'inserted-highlight';
    span.textContent = currentAnswer;
    range.insertNode(span);

    answerWindow.classList.remove('show');
    setTimeout(() => answerWindow.classList.remove('visible'), 200);
  }

  // 点击空白处关闭如影框
  document.getElementById('artboard').addEventListener('mousedown', (e) => {
    if (!ruyingBox.contains(e.target) && !toolbar.contains(e.target) && !answerWindow.contains(e.target)) {
      hideRuyingBox();
    }
  });
  // ── 通用打字动画 ──
  function typeInto(el, text, speed, onDone) {
    el.innerHTML = '';
    const cursor = document.createElement('span');
    cursor.className = 'typing-cursor';
    el.appendChild(cursor);
    let i = 0;
    function next() {
      if (i < text.length) {
        cursor.before(document.createTextNode(text[i++]));
        setTimeout(next, speed);
      } else {
        cursor.remove();
        if (onDone) onDone();
      }
    }
    setTimeout(next, 300);
  }

  // ── 翻译窗口 ──
  const translateWindow = document.getElementById('translateWindow');
  const twUserBubble    = document.getElementById('twUserBubble');
  const twResult        = document.getElementById('twResult');
  const twActions       = document.getElementById('twActions');
  let currentTranslation = '';

  function handleTranslate() {
    const text = selectedText;
    hideToolbar();
    if (!text) return;
    showTranslateWindow(text, null); // null = loading
  }

  function showTranslateWindow(original, translation) {
    const rLeft = parseInt(toolbar.style.left) || 700;
    const rTop  = parseInt(toolbar.style.top)  || 400;
    const twW = 440;
    let left = Math.max(8, Math.min(rLeft, 1600 - twW - 8));
    translateWindow.style.left   = left + 'px';
    translateWindow.style.top    = rTop + 'px';
    translateWindow.style.width  = '440px';
    translateWindow.style.height = '';

    twDR.disable();
    twUserBubble.textContent = original;
    twResult.innerHTML = '';
    twActions.style.display = 'none';
    currentTranslation = '';

    translateWindow.classList.add('visible');
    requestAnimationFrame(() => requestAnimationFrame(() => translateWindow.classList.add('show')));

    if (translation) {
      typeInto(twResult, translation, 22, () => {
        currentTranslation = translation;
        twActions.style.display = 'flex';
        twDR.enable();
      });
    } else {
      twResult.innerHTML = '<span style="color:rgba(255,255,255,0.4)">翻译中...</span>';
      fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(original)}&langpair=zh-CN|en`)
        .then(r => r.json())
        .then(data => {
          const result = data.responseData?.translatedText || '翻译失败，请重试';
          twResult.innerHTML = '';
          currentTranslation = result;
          typeInto(twResult, result, 22, () => {
            twActions.style.display = 'flex';
            twDR.enable();
          });
        })
        .catch(() => {
          twResult.innerHTML = '<span style="color:rgba(255,100,100,0.8)">网络错误，请重试</span>';
          twDR.enable();
        });
    }
  }

  });

    if (!savedRange) return;

    {
      match: /内容导入哪个版本/,
      result: '同时，烦请协助明确我方内容适合导入至哪一版本，以便提前做好适配准备。'
    },
    {
      match: /完整的宣发资料大概2月底会准备好/,
      result: '完整的宣发物料预计于2月底前整理完毕并提供，请届时查收。'
    },
    {
      match: /Hi\.王宇、金醒/,
      result: '王宇、金醒，您好，'
    },
    {
      match: /感谢/,
      result: '感谢您的支持与配合，期待您的回复！'
    }
  ];

  function getPolish(text) {
    for (const entry of POLISH_MAP) {
      if (entry.match.test(text)) return entry.result;
    }
    if (text.length > 30) {
      return '烦请提供天禧超级智能体近期版本迭代与上线时间计划，我方将据此制定内容导入与上线节奏。同时请协助明确，我方内容适配导入至哪个版本更为稳妥。完整宣发资料预计2月底前提供，感谢配合。';
    }
    return text; // 短文本直接返回原文
  }

  function handlePolish() {
    const text = selectedText;
    hideToolbar();
    if (!text) return;
    const polished = getPolish(text);
    showPolishWindow(text, polished);
  }

  function showPolishWindow(original, polished) {
    const rLeft = parseInt(toolbar.style.left) || 700;
    const rTop  = parseInt(toolbar.style.top)  || 400;
    const pwW = 440;
    let left = Math.max(8, Math.min(rLeft, 1600 - pwW - 8));
    polishWindow.style.left   = left + 'px';
    polishWindow.style.top    = rTop + 'px';
    polishWindow.style.width  = '440px';
    polishWindow.style.height = '';

    pwDR.disable();
    currentPolish = polished;
    pwUserBubble.textContent = original;
    pwResult.innerHTML = '';
    pwActions.style.display = 'none';

    polishWindow.classList.add('visible');
    requestAnimationFrame(() => requestAnimationFrame(() => polishWindow.classList.add('show')));

    typeInto(pwResult, polished, 28, () => {
      pwActions.style.display = 'flex';
      pwDR.enable();
    });
  }

  document.getElementById('pwClose').addEventListener('click', () => {
    polishWindow.classList.remove('show');
    setTimeout(() => polishWindow.classList.remove('visible'), 200);
    clearTimeout(pwTypingTimer);
  });

  function handlePwInsert() {
    if (!savedRange) return;
    const range = savedRange.cloneRange();
    range.collapse(false);
    const span = document.createElement('span');
    span.className = 'inserted-highlight';
    span.textContent = currentPolish;
    range.insertNode(span);
    polishWindow.classList.remove('show');
    setTimeout(() => polishWindow.classList.remove('visible'), 200);
  }

  function handlePwReplace() {
    if (!savedRange) return;
    const range = savedRange.cloneRange();
    range.deleteContents();
    const span = document.createElement('span');
    span.className = 'inserted-highlight';
    span.textContent = currentPolish;
    range.insertNode(span);
    polishWindow.classList.remove('show');
    setTimeout(() => polishWindow.classList.remove('visible'), 200);
  }
  // ── 拖拽 + Resize ──
  function makeDraggableResizable(win) {
    const board = document.getElementById('artboard');
    const header = win.querySelector('.aw-header');
    const handles = win.querySelectorAll('.resize-handle');
    let action = null;
    let dragEnabled = true;   // 拖动始终可用
    let resizeEnabled = false; // resize 生成完才开

    const maxW = () => 1600 * 0.7;
    const maxH = () => 1000 * 0.88;

    function getScale() {
      return board.getBoundingClientRect().width / 1600;
    }

    function startAction(e, type, dir) {
      if (type === 'drag' && !dragEnabled) return;
      if (type === 'resize' && !resizeEnabled) return;
      e.preventDefault();
      e.stopPropagation();
      const scale = getScale();
      if (type === 'resize' && !win.style.height) {
        win.style.height = win.offsetHeight + 'px';
      }
      action = {
        type, dir,
        startX: e.clientX / scale,
        startY: e.clientY / scale,
        startL: parseInt(win.style.left) || 0,
        startT: parseInt(win.style.top)  || 0,
        startW: win.offsetWidth,
        startH: win.offsetHeight,
      };
      win.classList.add(type === 'drag' ? 'dragging' : 'resizing');
      win.style.zIndex = 500;
    }

    header.addEventListener('mousedown', e => {
      if (e.target.closest('.aw-ctrl, .aw-header-icon')) return;
      startAction(e, 'drag', null);
    });

    handles.forEach(h => {
      const dir = [...h.classList].find(c => c !== 'resize-handle');
      h.addEventListener('mousedown', e => startAction(e, 'resize', dir));
    });

    document.addEventListener('mousemove', e => {
      if (!action) return;
      const scale = getScale();
      const dx = e.clientX / scale - action.startX;
      const dy = e.clientY / scale - action.startY;
      const minW = 440, minH = 320;

      if (action.type === 'drag') {
        const w = win.offsetWidth;
        const h = win.offsetHeight;
        const newL = Math.max(0, Math.min(1600 - w, action.startL + dx));
        const newT = Math.max(0, Math.min(1000 - h, action.startT + dy));
        win.style.left = newL + 'px';
        win.style.top  = newT + 'px';
      } else {
        let l = action.startL, t = action.startT, w = action.startW, h = action.startH;
        const d = action.dir;
        if (d.includes('e')) w = Math.min(maxW(), Math.max(minW, action.startW + dx));
        if (d.includes('s')) h = Math.min(maxH(), Math.max(minH, action.startH + dy));
        if (d.includes('w')) { const nw = Math.min(maxW(), Math.max(minW, action.startW - dx)); l = action.startL + (action.startW - nw); w = nw; }
        if (d.includes('n')) { const nh = Math.min(maxH(), Math.max(minH, action.startH - dy)); t = action.startT + (action.startH - nh); h = nh; }
        // 边界限制
        l = Math.max(0, Math.min(1600 - w, l));
        t = Math.max(0, Math.min(1000 - h, t));
        win.style.left   = l + 'px';
        win.style.top    = t + 'px';
        win.style.width  = w + 'px';
        win.style.height = h + 'px';
      }
    });

    document.addEventListener('mouseup', () => {
      if (!action) return;
      win.classList.remove('dragging', 'resizing');
      win.style.zIndex = 400;
      action = null;
    });

    handles.forEach(h => { h.style.pointerEvents = 'none'; });
    header.style.cursor = 'move'; // 拖动始终可用，cursor 始终显示

    return {
      enable() {
        resizeEnabled = true;
        handles.forEach(h => { h.style.pointerEvents = 'auto'; });
      },
      disable() {
        resizeEnabled = false;
        action = null;
        handles.forEach(h => { h.style.pointerEvents = 'none'; });
      }
    };
  }

  const awDR = makeDraggableResizable(document.getElementById('answerWindow'));
  const twDR = makeDraggableResizable(document.getElementById('translateWindow'));
  const pwDR = makeDraggableResizable(document.getElementById('polishWindow'));

</script>
